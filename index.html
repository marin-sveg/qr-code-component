<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050506">
  <meta name="description" content="Scan the QR code to visit marin-sveg on GitHub.">
  <title>GitHub Profile</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="universe" aria-hidden="true"><div class="halo"></div><div class="stars"></div><div class="comets" id="comets"></div></div>
  <main>
    <article class="glass-card" aria-labelledby="card-title">
      <div class="card-top"><span class="github-icon" aria-hidden="true"></span><span>GITHUB PROFILE</span></div>
      <a class="qr-panel" href="https://github.com/marin-sveg" target="_blank" rel="noopener noreferrer" aria-label="Open marin-sveg on GitHub"><img src="qr.svg" width="304" height="304" alt="QR code for https://github.com/marin-sveg"></a>
      <div class="card-copy"><h1 id="card-title">marin-sveg</h1><p>Scan to view my GitHub profile.</p></div>
      <a class="profile-link" href="https://github.com/marin-sveg" target="_blank" rel="noopener noreferrer">Open GitHub</a>
    </article>
  </main>
</body>
</html>
